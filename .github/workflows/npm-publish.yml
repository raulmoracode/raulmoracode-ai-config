name: Publish to npm

on:
  push:
    tags:
      - v0.0.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-v0.0.1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v0.0.1
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify release version and package availability
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          test "$package_version" = "0.0.1"
          test "$tag_version" = "$package_version"

          if npm view "$package_name@$package_version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "The package version is already published: $package_name@$package_version" >&2
            exit 1
          fi

      - name: Inspect npm package contents
        run: npm pack --dry-run

      - name: Publish package with provenance
        run: npm publish --access public --provenance
